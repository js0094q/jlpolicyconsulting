name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  high-risk-change-detection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detect workflow and lockfile-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if [ -z "$changed_files" ]; then
            echo "No changed files detected."
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^\.github/workflows/'; then
            echo "::warning::Workflow changes detected. Verify SHA pinning and review approvals."
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "::warning::Lockfile changes detected. Verify dependency review and provenance."
          fi

          high_risk_only_pattern='^(\.github/workflows/.*|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'
          if ! printf '%s\n' "$changed_files" | grep -Eqv "$high_risk_only_pattern"; then
            echo "::error::PR changes only workflow and/or lockfile files. Require explicit security review."
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Content
        run: npm run validate:content

      - name: Validate CODEOWNERS Coverage
        run: npm run validate:codeowners

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev
